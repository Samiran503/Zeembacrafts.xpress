/zeemba01" target="_blank" rel="noopener" class="bn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:280px;background:#6B4636;color:#FFFFFF;border-radius:12px;padding:14px 24px;font-weight:600;text-decoration:none;transition:background-color 0.2s;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg> Follow Us on Instagram</a></div></div>`}

  ["ov","modal","drawer","menu","adm"].forEach(i=>{const e=$(i);if(e)e.classList.remove("show")});
  document.body.style.overflow="";
}
